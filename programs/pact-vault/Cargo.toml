[package]
name = "pact-vault"
version = "0.2.0"
edition = "2021"
[lib]
crate-type = ["cdylib", "lib"]
name = "pact_vault"
[features]
default = []
no-entrypoint = []
cpi = ["no-entrypoint"]
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "game-v2/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []
[dependencies]
anchor-lang = "=1.1.2"
game-v2 = { path = "../game-v2", features = ["no-entrypoint"] }
[dev-dependencies]
litesvm = "=0.9.1"
solana-address = "=2.9.0"
solana-keypair = "=3.1.0"
solana-signer = "=3.0.0"
solana-message = "=3.0.1"
solana-transaction = "=3.0.2"
solana-instruction = "=3.1.0"
solana-account = "=3.4.0"
solana-clock = "=3.0.1"
borsh = "1.5.7"
bincode = "1.3.3"
