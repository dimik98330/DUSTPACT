[package]
name = "game-v3"
version = "0.3.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "game_v3"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = "=1.1.2"
solana-sha256-hasher = "=3.1.0"
dustpact-rules-v3 = { path = "../../crates/rules-v3" }

[dev-dependencies]
litesvm = "=0.9.1"
solana-address = "=2.9.0"
solana-keypair = "=3.1.0"
solana-signer = "=3.0.0"
solana-message = "=3.0.1"
solana-transaction = "=3.0.2"
solana-instruction = "=3.1.0"
solana-clock = "=3.0.1"
bincode = "1.3.3"
borsh = "1.5.7"
